SHORTDESC='Free self-hosted sales CRM and workforce operations (runs in Docker)'
LONGDESC=' Zulivio is a free, open-source CRM for telecalling teams: leads, call logs,
 follow-ups, scoring, attendance and assignments. This package installs a
 systemd service that runs the published, version-pinned Zulivio containers and
 a PostgreSQL database with Docker Compose, keeping all data in Docker volumes
 on this machine. Open http://localhost:3100 after installing.
 .
 Settings are in /etc/zulivio/zulivio.env. Upgrade with apt; back up your data
 first.'
