services:
  postgres:
    image: postgres:16-alpine
    container_name: zulivio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodedr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in /etc/zulivio/zulivio.env}
      POSTGRES_DB: zulivio
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodedr -d zulivio"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  backend:
    image: ghcr.io/raktim94/zulivio-backend:@VERSION@
    container_name: zulivio-backend
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]
    environment:
      DATABASE_URL: "postgresql://nodedr:${POSTGRES_PASSWORD}@postgres:5432/zulivio"
      PORT: "4100"
      NODE_ENV: production
      CORS_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3100}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      UPLOADS_DIR: "/data/uploads"
      BOOTSTRAP_DISABLED: "${BOOTSTRAP_DISABLED:-false}"
      GOOGLE_SHEETS_CLIENT_EMAIL: "${GOOGLE_SHEETS_CLIENT_EMAIL:-}"
      GOOGLE_SHEETS_PRIVATE_KEY: "${GOOGLE_SHEETS_PRIVATE_KEY:-}"
      FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY:-}"
      FIELD_ENCRYPTION_KEY_PATH: "/data/secrets/field-encryption.key"
      S3_BACKUP_ENDPOINT: "${S3_BACKUP_ENDPOINT:-}"
      S3_BACKUP_BUCKET: "${S3_BACKUP_BUCKET:-}"
      S3_BACKUP_ACCESS_KEY_ID: "${S3_BACKUP_ACCESS_KEY_ID:-}"
      S3_BACKUP_SECRET_ACCESS_KEY: "${S3_BACKUP_SECRET_ACCESS_KEY:-}"
      S3_BACKUP_REGION: "${S3_BACKUP_REGION:-auto}"
      S3_BACKUP_INTERVAL_DAYS: "${S3_BACKUP_INTERVAL_DAYS:-3}"
      S3_BACKUP_RETAIN_COUNT: "${S3_BACKUP_RETAIN_COUNT:-2}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4100"
    volumes:
      - uploads_data:/data/uploads
      - secrets_data:/data/secrets
    security_opt:
      - no-new-privileges:true
  web:
    image: ghcr.io/raktim94/zulivio-web:@VERSION@
    container_name: zulivio-web
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "${HOST_PORT:-3100}:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
volumes:
  pg_data:
  uploads_data:
  secrets_data:
