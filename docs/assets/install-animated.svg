<g clip-path="url(#k0)"><text x="28" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#a78bfa">$</text><text x="50" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">git clone https://github.com/Raktim94/zulivio</text></g>
<g clip-path="url(#k1)"><text x="28" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#a78bfa">$</text><text x="50" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">cd zulivio</text></g>
<g clip-path="url(#k2)"><text x="28" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#a78bfa">$</text><text x="50" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">./install.sh</text></g>
