name: Build Windows MSIX (Microsoft Store)

# Builds Zulivio-<version>.0-x64.msix — a standalone Windows desktop app
# (embedded PostgreSQL + the NestJS backend + the Next.js frontend, hosted
# in a WebView2 window) that is architecturally separate from the Docker/
# CasaOS deployment. See packaging/windows/README.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - "packages/types/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-msix.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the MSIX (four-part x.y.z.0)"
        required: false
        default: "1.0.0"
      release_tag:
        description: "Attach the MSIX to this existing release tag (blank = artifact only, not published)"
        required: false
        default: ""

concurrency:
  group: build-windows-msix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node auto-detects the "packageManager": "pnpm@..." field in
          # package.json and tries to invoke `pnpm` to set up its cache —
          # before pnpm exists anywhere on this runner (build-msix.ps1 is
          # what installs it, via `corepack enable`, later). Without this,
          # the step fails outright with "Unable to locate executable file:
          # pnpm" before the build even starts.
          package-manager-cache: false

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      # Package identity comes from Partner Center -> your app -> Product
      # management -> App identity, and is never hardcoded — see
      # packaging/windows/README.md. Without the real secrets set, this
      # still runs a full build/install/uninstall smoke test under a
      # throwaway test identity, so the pipeline itself is exercised even
      # before Partner Center approval exists; the resulting .msix from
      # that path must NOT be uploaded to Partner Center.
      - name: Resolve package identity
        id: identity
        shell: pwsh
        env:
          REAL_NAME: ${{ secrets.ZULIVIO_MSIX_IDENTITY_NAME }}
          REAL_PUBLISHER: ${{ secrets.ZULIVIO_MSIX_PUBLISHER_CN }}
        run: |
          $hasReal = -not [string]::IsNullOrEmpty($env:REAL_NAME) -and -not [string]::IsNullOrEmpty($env:REAL_PUBLISHER)
          "has-real-identity=$($hasReal.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($hasReal) {
            Write-Host "Using the real Partner Center identity from repo secrets."
          } else {
            Write-Host "::warning::ZULIVIO_MSIX_IDENTITY_NAME / ZULIVIO_MSIX_PUBLISHER_CN are not set — building under a throwaway test identity. This build is for CI smoke-testing only and must NOT be uploaded to Partner Center."
          }

      - name: Build MSIX
        id: build
        shell: pwsh
        env:
          REAL_NAME: ${{ secrets.ZULIVIO_MSIX_IDENTITY_NAME }}
          REAL_PUBLISHER: ${{ secrets.ZULIVIO_MSIX_PUBLISHER_CN }}
        run: |
          $identityName = if ($env:REAL_NAME) { $env:REAL_NAME } else { "ZulivioCITestOnly" }
          $publisherCn  = if ($env:REAL_PUBLISHER) { $env:REAL_PUBLISHER } else { "CN=Zulivio-CI-Test-Only" }
          pwsh -File packaging\windows\build-msix.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -PackageIdentityName $identityName `
            -PublisherCn $publisherCn `
            -SelfSignForTesting

      # -----------------------------------------------------------------
      # Smoke test: install it, use it, uninstall it — on real Windows.
      # -----------------------------------------------------------------
      - name: Enable sideloading (CI only — Store installs don't need this)
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name "AllowAllTrustedApps" -Value 1 -Type DWord

      - name: Trust the CI test certificate
        shell: pwsh
        run: |
          $cer = Get-ChildItem dist\zulivio-test.cer -ErrorAction SilentlyContinue
          if (-not $cer) { throw "test certificate not found at dist\zulivio-test.cer — build-msix.ps1 -SelfSignForTesting should have exported one" }
          Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null

      - name: Install the MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist\Zulivio-*-x64.msix | Select-Object -First 1
          Write-Host "Installing $($msix.Name)"
          Add-AppxPackage -Path $msix.FullName

      # See launcher\Program.cs's header comment: for a runFullTrust app with
      # no WinRT/Package-identity API usage, launching the exe directly from
      # its install location is functionally equivalent to shell activation
      # and avoids depending on Explorer/shell working inside a CI session.
      - name: Launch the app
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name "*Zulivio*" | Select-Object -First 1
          if (-not $pkg) { throw "package not found after install" }
          $exe = Join-Path $pkg.InstallLocation "zulivio.exe"
          if (-not (Test-Path $exe)) { throw "zulivio.exe not found at $exe" }
          Write-Host "Starting $exe"
          Start-Process -FilePath $exe

      # Proves the whole chain actually works: embedded Postgres initialized
      # and started, `prisma migrate deploy` succeeded against it, and the
      # backend answered with the database reachable — not just that
      # zulivio.exe itself is alive.
      - name: Wait for the backend to report ready (Postgres + migrations)
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..120) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:4100/api/health/ready" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) {
            Write-Host "=== zulivio.exe / node.exe / postgres.exe processes ==="
            Get-Process zulivio, node, postgres -ErrorAction SilentlyContinue | Format-Table
            Write-Host "=== C:\ProgramData\Zulivio\logs ==="
            Get-ChildItem "C:\ProgramData\Zulivio\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 60 }
            throw "the backend did not report ready on http://127.0.0.1:4100/api/health/ready within 240s"
          }
          Write-Host "Backend healthy (database reachable, migrations applied)"

      - name: Verify WebView2 actually initialized (not just the backend HTTP endpoint)
        shell: pwsh
        run: |
          $logPath = "C:\ProgramData\Zulivio\logs\launcher.log"
          $ready = $false
          foreach ($i in 1..30) {
            if ((Test-Path $logPath) -and (Select-String -Path $logPath -Pattern "READY" -SimpleMatch -Quiet)) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Host "=== C:\ProgramData\Zulivio\logs\launcher.log ==="
            Get-Content $logPath -ErrorAction SilentlyContinue
            throw "zulivio.exe never logged a WebView2 READY line — the launcher's own WebView2 control did not initialize, even though the backend HTTP health check passed."
          }
          Write-Host "  [PASS] WebView2 initialized and navigated (launcher.log contains READY)"

      # End-to-end functional check through the real HTTP surface: create an
      # organization (the same self-service bootstrap flow the app's first
      # run screen drives) and log in with it — proves the embedded database
      # actually accepts real writes/reads through the full backend stack,
      # not just SELECT 1.
      - name: Functional test — bootstrap an organization and log in
        shell: pwsh
        run: |
          # The backend's csrf-origin-check middleware (apps/backend/src/
          # common/csrf-origin-check.ts) requires a matching Origin (or
          # Referer) header on every state-changing request — this is
          # correct, deliberate defense-in-depth (see that file's own
          # comment) that every real browser satisfies automatically on
          # POST requests, same-origin or not. Invoke-WebRequest does NOT
          # set one on its own, so it must be added explicitly here to
          # behave like the real browser this test is meant to simulate —
          # this is a test-script gap, not an application bug (confirmed by
          # reading csrf-origin-check.ts: no origin/referer at all is
          # correctly rejected with 403 "Cross-origin request blocked").
          $originHeader = @{ Origin = "http://localhost:3100" }

          $body = @{
            organizationName = "CI Test Org"
            fullName         = "CI Test Owner"
            email            = "ci-test@example.com"
            password         = "CorrectHorseBatteryStaple123"
          } | ConvertTo-Json
          $bootstrap = Invoke-WebRequest -Uri "http://127.0.0.1:4100/api/v1/bootstrap" -Method Post -Headers $originHeader -Body $body -ContentType "application/json" -UseBasicParsing
          if ($bootstrap.StatusCode -ne 201 -and $bootstrap.StatusCode -ne 200) { throw "bootstrap returned status $($bootstrap.StatusCode)" }
          Write-Host "  [PASS] bootstrap created an organization + master owner"

          $loginBody = @{ email = "ci-test@example.com"; password = "CorrectHorseBatteryStaple123" } | ConvertTo-Json
          $session = Invoke-WebRequest -Uri "http://127.0.0.1:4100/api/v1/auth/sessions" -Method Post -Headers $originHeader -Body $loginBody -ContentType "application/json" -UseBasicParsing -SessionVariable webSession
          if ($session.StatusCode -ne 201 -and $session.StatusCode -ne 200) { throw "login returned status $($session.StatusCode)" }
          if (-not $webSession.Cookies.GetCookies("http://127.0.0.1:4100").Count) { throw "login did not set a session cookie" }
          Write-Host "  [PASS] login succeeded and set a session cookie"

          $webPage = Invoke-WebRequest -Uri "http://127.0.0.1:3100/" -UseBasicParsing
          if ($webPage.StatusCode -ne 200) { throw "frontend root page returned status $($webPage.StatusCode)" }
          Write-Host "  [PASS] frontend served the app shell on http://127.0.0.1:3100"

      - name: Verify process tree and loopback-only binding
        shell: pwsh
        run: |
          $fail = 0
          function Check($name, [bool]$cond) {
            if ($cond) { Write-Host "  [PASS] $name" } else { Write-Host "  [FAIL] $name"; $script:fail++ }
          }
          Check "zulivio.exe running"          ((Get-Process zulivio -ErrorAction SilentlyContinue) -ne $null)
          Check "two node.exe children running" ((Get-Process node -ErrorAction SilentlyContinue | Measure-Object).Count -eq 2)
          Check "one postgres.exe running"      ((Get-Process postgres -ErrorAction SilentlyContinue | Measure-Object).Count -ge 1)
          Check "PostgreSQL data directory created" (Test-Path "C:\ProgramData\Zulivio\pgdata\PG_VERSION")
          Check "field-encryption key persisted"    (Test-Path "C:\ProgramData\Zulivio\secrets\field-encryption.key")

          foreach ($portInfo in @(@{Port=4100;Name="backend"}, @{Port=3100;Name="frontend"})) {
            $conn = Get-NetTCPConnection -LocalPort $portInfo.Port -State Listen -ErrorAction SilentlyContinue
            $loopbackOnly = ($conn | Measure-Object).Count -gt 0 -and (($conn | ForEach-Object { $_.LocalAddress } | Where-Object { $_ -notin @("127.0.0.1", "::1") } | Measure-Object).Count -eq 0)
            Check ("port $($portInfo.Port) ($($portInfo.Name)) bound to loopback only (not 0.0.0.0/::)") $loopbackOnly
          }

          # Postgres's port is chosen dynamically at runtime (GetFreeTcpPort in
          # Program.cs) specifically to avoid Windows' dynamically-reserved
          # ephemeral port ranges — a real CI failure hit "could not bind IPv4
          # address 127.0.0.1: Permission denied" on a hardcoded port that
          # happened to fall in one such range. Discover its actual port by
          # process ownership instead of assuming a fixed number.
          $pgProc = Get-Process postgres -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pgProc) {
            $pgConn = Get-NetTCPConnection -OwningProcess $pgProc.Id -State Listen -ErrorAction SilentlyContinue
            $pgLoopbackOnly = ($pgConn | Measure-Object).Count -gt 0 -and (($pgConn | ForEach-Object { $_.LocalAddress } | Where-Object { $_ -notin @("127.0.0.1", "::1") } | Measure-Object).Count -eq 0)
            Check "postgres (dynamic port) bound to loopback only (not 0.0.0.0/::)" $pgLoopbackOnly
          } else {
            Check "postgres (dynamic port) bound to loopback only (not 0.0.0.0/::)" $false
          }
          if ($fail -gt 0) { throw "$fail check(s) failed" }

      - name: Dump logs (only runs if a previous step failed)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== C:\ProgramData\Zulivio\logs ==="
          Get-ChildItem "C:\ProgramData\Zulivio\logs" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 80 }
          Write-Host "=== event log (Application) ==="
          Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.LevelDisplayName -eq "Error" } | Format-Table -AutoSize

      # Regression check for launcher\Program.cs's shutdown sequence: closing
      # zulivio.exe should cleanly stop both node.exe children AND the
      # embedded postgres.exe (gracefully, via pg_ctl stop — not orphaned,
      # not hard-killed as the primary path). No process from this app
      # should survive.
      - name: Verify closing the app stops every child process (backend, frontend, Postgres)
        shell: pwsh
        run: |
          Stop-Process -Name zulivio -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8
          $orphanedNode = Get-Process node -ErrorAction SilentlyContinue
          $orphanedPg   = Get-Process postgres -ErrorAction SilentlyContinue
          if ($orphanedNode -or $orphanedPg) {
            $orphanedNode | Format-Table
            $orphanedPg | Format-Table
            throw "a child process survived zulivio.exe closing — shutdown cleanup did not work"
          }
          Write-Host "  [PASS] no orphaned node.exe or postgres.exe processes after closing the app"

      - name: Check Application event log for errors
        shell: pwsh
        run: |
          $errors = Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.LevelDisplayName -eq "Error" -and $_.TimeCreated -gt (Get-Date).AddMinutes(-15) -and ($_.ProviderName -match "Zulivio|node|postgres|AppX") }
          if ($errors) {
            $errors | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::warning::Errors found in the Application event log during this run — review before submitting to Partner Center."
          } else {
            Write-Host "no matching errors in the Application event log"
          }

      - name: Windows App Certification Kit (best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $appcert = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe" -ErrorAction SilentlyContinue
          if (-not $appcert) {
            Write-Host "::warning::appcert.exe not found on this runner image — run the Windows App Certification Kit manually before submitting."
            exit 0
          }
          $pkg = (Get-AppxPackage -Name "*Zulivio*" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $pkg) { Write-Host "::warning::could not find the installed package for WACK targeting"; exit 0 }
          & $appcert.FullName reset
          & $appcert.FullName test -packagefullname $pkg.PackageFullName -reportoutputpath dist\wack-report.xml

      # NOTE ON DATA RETENTION: this deliberately mirrors nodedr-pos's own
      # tested convention — C:\ProgramData\Zulivio (the embedded Postgres
      # data directory, uploads, the field-encryption key) lives OUTSIDE the
      # MSIX package and is intentionally preserved across uninstall, the
      # same way installing a database server or Docker Desktop does not
      # delete your data when you remove the application. What IS verified
      # to be fully gone is every *process* and the app's own package
      # registration — no orphaned zulivio.exe/node.exe/postgres.exe, no
      # leftover Start Menu entry. If Zulivio should instead wipe
      # C:\ProgramData\Zulivio on uninstall (a real, different behavior:
      # normal MSIX uninstall has no hook to run cleanup code at all, so
      # that would need an explicit "Uninstall & erase all data" action
      # inside the app itself), that is a deliberate product decision to
      # confirm, not assumed here.
      - name: Uninstall
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name "*Zulivio*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pkg) { Remove-AppxPackage -Package $pkg.PackageFullName }
          Start-Sleep -Seconds 5
          if ((Get-AppxPackage -Name "*Zulivio*" -ErrorAction SilentlyContinue)) { throw "package still registered after uninstall" }
          Write-Host "  [PASS] package removed"
          $stragglers = Get-Process zulivio, node, postgres -ErrorAction SilentlyContinue
          if ($stragglers) {
            $stragglers | Format-Table
            throw "process(es) still running after uninstall"
          }
          Write-Host "  [PASS] no processes running after uninstall"
          if (-not (Test-Path "C:\ProgramData\Zulivio\pgdata\PG_VERSION")) { throw "uninstall deleted the database — it must be preserved (see this job's design note above)" }
          Write-Host "  [PASS] database preserved through uninstall (ProgramData is outside the MSIX package), by design"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\Zulivio-*-x64.msix | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath dist\SHA256SUMS-msix.txt -Append -Encoding ascii
            Write-Host "$h  $($_.Name)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: zulivio-msix
          path: |
            dist/Zulivio-*-x64.msix
            dist/SHA256SUMS-msix.txt
            dist/wack-report.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: github.event.inputs.release_tag != '' && steps.identity.outputs.has-real-identity == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msix = Get-ChildItem dist\Zulivio-*-x64.msix | Select-Object -First 1
          gh release upload "${{ github.event.inputs.release_tag }}" $msix.FullName --clobber
          gh release upload "${{ github.event.inputs.release_tag }}" dist\SHA256SUMS-msix.txt --clobber

      - name: Skipped publishing (test-identity build)
        if: github.event.inputs.release_tag != '' && steps.identity.outputs.has-real-identity != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::release_tag was set but this build used the CI-test-only identity (ZULIVIO_MSIX_IDENTITY_NAME/ZULIVIO_MSIX_PUBLISHER_CN secrets not set) — refusing to publish a package with the wrong identity. Set the real secrets, then re-run with the same release_tag."
