name: Publish Docker images

# Builds and publishes the backend/web images that the CasaOS/ZimaOS app
# store manifest (casaos/docker-compose.yml) pulls as pre-built,
# version-pinned images from GHCR. CasaOS installs an app straight from its
# compose file with no build step and no access to this repo's source, so
# `build:` (used in the repo-root compose.yaml for a clone+build flow) is
# not an option there — the CasaOS manifest instead references
# `ghcr.io/raktim94/zulivio-{backend,web}:<version>`, and those tags only
# exist because this workflow pushed them.
#
# Multi-arch (amd64 + arm64) on purpose: a real share of CasaOS/ZimaOS boxes
# are ARM SBCs, and declaring `architectures: [amd64, arm64]` in the
# x-casaos manifest without actually publishing an arm64 image would
# install a broken app on that hardware.
#
# Built as "one native build per platform, then merge into one manifest"
# rather than a single QEMU-emulated multi-platform buildx call — this repo
# is public, so GitHub's hosted arm64 runners (ubuntu-24.04-arm, GA since
# Aug 2025, free for public repos) are available, and building arm64
# natively instead of emulating it under QEMU is dramatically faster (QEMU
# emulation of the web image's Next.js/SWC build was the actual bottleneck
# — 11-18+ min on its own, and flaky: it crashed mid-build with a QEMU
# SIGILL at least once). The published tags/manifest are identical either
# way — `docker buildx imagetools create` combines the two native
# single-arch images into the exact same kind of multi-arch manifest list
# `platforms: linux/amd64,linux/arm64` used to produce directly.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docker-publish.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.0.0). Also pushed as :latest."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow checkout has no tags, which would silently produce an
          # empty VERSION below (git describe finds nothing, no error) —
          # fetch-depth: 0 pulls full history + tags.
          fetch-depth: 0

      - name: Resolve version and image owner
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            # --exact-match only succeeds when HEAD *is* a tagged commit.
            # A plain push to main (this workflow's other trigger) is
            # usually NOT at a tag — using --abbrev=0 there would resolve to
            # the nearest ANCESTOR tag instead and silently republish that
            # older version's image tag with today's code, corrupting it.
            # (This bug was live from 2026-08-13 to 2026-08-28: every plain
            # push after v1.4.0 was tagged kept overwriting the `1.4.0`
            # GHCR tag, since no newer git tag ever existed to be found.)
            GIT_TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
            if [ -n "$GIT_TAG" ]; then
              VERSION="${GIT_TAG#v}"
            else
              VERSION="0.0.0-dev"
            fi
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Resolved VERSION is empty - refusing to publish an untagged image" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR image paths must be lowercase; the GitHub owner name is not
          # guaranteed to be.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zulivio-backend
            dockerfile: apps/backend/Dockerfile
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - image: zulivio-backend
            dockerfile: apps/backend/Dockerfile
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
          - image: zulivio-web
            dockerfile: apps/web/Dockerfile
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - image: zulivio-web
            dockerfile: apps/web/Dockerfile
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single arch, native — no QEMU)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.suffix }}

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [zulivio-backend, zulivio-web]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge amd64 + arm64 into one multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}"
          VERSION="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
