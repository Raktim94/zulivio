name: Build Windows MSIX — Store Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the MSIX"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-store:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Partner Center identity
        shell: pwsh
        env:
          REAL_NAME: ${{ secrets.ZULIVIO_MSIX_IDENTITY_NAME }}
          REAL_PUBLISHER: ${{ secrets.ZULIVIO_MSIX_PUBLISHER_CN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REAL_NAME)) {
            throw "ZULIVIO_MSIX_IDENTITY_NAME is not set"
          }

          if ([string]::IsNullOrWhiteSpace($env:REAL_PUBLISHER)) {
            throw "ZULIVIO_MSIX_PUBLISHER_CN is not set"
          }

          Write-Host "Partner Center identity validated."

      # Build a signed package only for Windows CI testing.
      - name: Build CI test package
        shell: pwsh
        env:
          REAL_NAME: ${{ secrets.ZULIVIO_MSIX_IDENTITY_NAME }}
          REAL_PUBLISHER: ${{ secrets.ZULIVIO_MSIX_PUBLISHER_CN }}
        run: |
          pwsh -File packaging\windows\build-msix.ps1 `
            -Version "${{ inputs.version }}" `
            -PackageIdentityName $env:REAL_NAME `
            -PublisherCn $env:REAL_PUBLISHER `
            -SelfSignForTesting

      - name: Enable sideloading for CI validation
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name AllowAllTrustedApps -Value 1 -Type DWord

      - name: Trust CI certificate
        shell: pwsh
        run: |
          $cer = Get-ChildItem dist\zulivio-test.cer |
            Select-Object -First 1

          if (-not $cer) {
            throw "CI certificate not found"
          }

          Import-Certificate `
            -FilePath $cer.FullName `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople |
            Out-Null

          Import-Certificate `
            -FilePath $cer.FullName `
            -CertStoreLocation Cert:\LocalMachine\Root |
            Out-Null

      - name: Install CI package
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist\Zulivio-*-x64.msix |
            Select-Object -First 1

          Add-AppxPackage -Path $msix.FullName

      - name: Launch Zulivio
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name "*Zulivio*" |
            Select-Object -First 1

          if (-not $pkg) {
            throw "Zulivio package was not installed"
          }

          Start-Process `
            -FilePath (Join-Path $pkg.InstallLocation "zulivio.exe")

      - name: Validate backend
        shell: pwsh
        run: |
          $ok = $false

          foreach ($i in 1..120) {
            try {
              $r = Invoke-WebRequest `
                -Uri "http://127.0.0.1:4100/api/health/ready" `
                -UseBasicParsing `
                -TimeoutSec 3

              if ($r.StatusCode -eq 200) {
                $ok = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ok) {
            throw "Zulivio backend did not become ready"
          }

          Write-Host "Backend validation passed."

      - name: Validate WebView2
        shell: pwsh
        run: |
          $log = "C:\ProgramData\Zulivio\logs\launcher.log"
          $ok = $false

          foreach ($i in 1..30) {
            if (
              (Test-Path $log) -and
              (Select-String `
                -Path $log `
                -Pattern "READY" `
                -SimpleMatch `
                -Quiet)
            ) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $ok) {
            throw "WebView2 READY marker was not observed"
          }

          Write-Host "WebView2 validation passed."

      - name: Functional smoke test
        shell: pwsh
        run: |
          $origin = @{
            Origin = "http://localhost:3100"
          }

          $body = @{
            organizationName = "CI Test Org"
            fullName = "CI Test Owner"
            email = "ci-test@example.com"
            password = "CorrectHorseBatteryStaple123"
          } | ConvertTo-Json

          $r = Invoke-WebRequest `
            -Uri "http://127.0.0.1:4100/api/v1/bootstrap" `
            -Method Post `
            -Headers $origin `
            -Body $body `
            -ContentType "application/json" `
            -UseBasicParsing

          if ($r.StatusCode -ne 200 -and $r.StatusCode -ne 201) {
            throw "bootstrap returned $($r.StatusCode)"
          }

          $login = @{
            email = "ci-test@example.com"
            password = "CorrectHorseBatteryStaple123"
          } | ConvertTo-Json

          $s = Invoke-WebRequest `
            -Uri "http://127.0.0.1:4100/api/v1/auth/sessions" `
            -Method Post `
            -Headers $origin `
            -Body $login `
            -ContentType "application/json" `
            -UseBasicParsing `
            -SessionVariable session

          if ($s.StatusCode -ne 200 -and $s.StatusCode -ne 201) {
            throw "login returned $($s.StatusCode)"
          }

          if (
            -not $session.Cookies.GetCookies(
              "http://127.0.0.1:4100"
            ).Count
          ) {
            throw "login did not set session cookie"
          }

          $page = Invoke-WebRequest `
            -Uri "http://127.0.0.1:3100/" `
            -UseBasicParsing

          if ($page.StatusCode -ne 200) {
            throw "frontend returned $($page.StatusCode)"
          }

          Write-Host "Functional smoke test passed."

      - name: Uninstall CI package
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name "*Zulivio*" |
            Remove-AppxPackage -ErrorAction SilentlyContinue

      # IMPORTANT:
      # This second build intentionally does NOT use
      # -SelfSignForTesting. This is the package intended for Partner Center.
      - name: Build final Store package
        shell: pwsh
        env:
          REAL_NAME: ${{ secrets.ZULIVIO_MSIX_IDENTITY_NAME }}
          REAL_PUBLISHER: ${{ secrets.ZULIVIO_MSIX_PUBLISHER_CN }}
        run: |
          Remove-Item `
            dist\Zulivio-*-x64.msix `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            dist\zulivio-test.cer `
            -Force `
            -ErrorAction SilentlyContinue

          pwsh -File packaging\windows\build-msix.ps1 `
            -Version "${{ inputs.version }}" `
            -PackageIdentityName $env:REAL_NAME `
            -PublisherCn $env:REAL_PUBLISHER

      - name: Verify Store package
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist\Zulivio-*-x64.msix |
            Select-Object -First 1

          if (-not $msix) {
            throw "Final MSIX was not produced"
          }

          $tmp = Join-Path $env:RUNNER_TEMP "verify-msix"

          Remove-Item `
            $tmp `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $tmp |
            Out-Null

          $makeappx = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter makeappx.exe |
            Where-Object {
              $_.FullName -match "\\x64\\makeappx\.exe$"
            } |
            Select-Object -First 1

          if (-not $makeappx) {
            throw "makeappx.exe not found"
          }

          & $makeappx.FullName `
            unpack `
            /p $msix.FullName `
            /d $tmp `
            /o

          if ($LASTEXITCODE -ne 0) {
            throw "makeappx unpack failed"
          }

          $signature = Join-Path $tmp "AppxSignature.p7x"

          if (Test-Path $signature) {
            throw "Final package contains AppxSignature.p7x; expected unsigned Store submission package"
          }

          Write-Host "Store package verification passed."

      - name: SHA256
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist\Zulivio-*-x64.msix |
            Select-Object -First 1

          $hash = (
            Get-FileHash `
              $msix.FullName `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$($msix.Name)  $hash" |
            Set-Content dist\SHA256SUMS-store.txt

          Write-Host "MSIX: $($msix.Name)"
          Write-Host "SHA256: $hash"

      - name: Upload Store submission artifact
        uses: actions/upload-artifact@v7
        with:
          name: zulivio-store-msix
          path: |
            dist/Zulivio-*-x64.msix
            dist/SHA256SUMS-store.txt
          if-no-files-found: error
          retention-days: 14
