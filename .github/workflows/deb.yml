name: Debian package

# Builds zulivio for amd64 and arm64 and proves it works: installs it on a native runner of each architecture,
# waits for the app to answer, reinstalls, removes and purges it (packaging/deb/test.sh). A release is published
# only by running this workflow by hand with a version: it attaches the .deb files and SHA-256 checksums to the
# GitHub release v<version>.

on:
  pull_request:
    paths: ["packaging/deb/**", ".github/workflows/deb.yml"]
  push:
    branches: [main]
    paths: ["packaging/deb/**", ".github/workflows/deb.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, for example 1.12.0. Leave empty to build and test only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build both architectures
        run: |
          VERSION="${{ github.event.inputs.version }}"; VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || VERSION="1.12.0"
          packaging/deb/build.sh "$VERSION"
          for f in dist/*.deb; do dpkg-deb -I "$f" | head -12; done
      - name: Scripts parse
        run: for f in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/build.sh packaging/deb/test.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: debs, path: "dist/*", if-no-files-found: error }

  test:
    name: Install and remove (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: debs, path: dist }
      - name: Verify checksum
        run: cd dist && sha256sum -c ./*_${{ matrix.arch }}.deb.sha256
      - name: Install, answer, reinstall, remove, purge
        run: sudo DEB="$PWD/$(ls dist/*_${{ matrix.arch }}.deb)" packaging/deb/test.sh

  # Debian 12 has no docker-compose-v2 package; the installer adds Docker's own apt repository. This proves the package's
  # dependencies resolve on a stock Debian 12 image after exactly that step (a full run needs a VM with systemd and Docker).
  deps-debian12:
    name: Dependencies resolve on Debian 12
    needs: build
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/download-artifact@v4
        with: { name: debs, path: dist }
      - name: Add Docker's repository as the installer does, then simulate the install
        run: |
          set -eu
          apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          . /etc/os-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL "https://download.docker.com/linux/${ID}/gpg" -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${ID} ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -s -y ./dist/*_amd64.deb | grep -E "^Inst (docker-ce|docker-compose-plugin|zulivio) "
          # And without Docker's repository the same simulation must fail clearly, which is why the one-command installer exists.
          rm /etc/apt/sources.list.d/docker.list && apt-get update -qq
          if apt-get install -s -y ./dist/*_amd64.deb >/dev/null 2>&1; then echo "note: resolves on stock Debian 12 without Docker's repository"; else echo "as expected: stock Debian 12 needs Docker's repository (the installer adds it)"; fi

  publish:
    name: Publish release assets
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    needs: [build, test, deps-debian12]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: debs, path: dist }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"; VERSION="${VERSION#v}"; TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* packaging/deb/install-linux.sh --clobber
          else
            gh release create "$TAG" dist/* packaging/deb/install-linux.sh --target "${{ github.sha }}" --title "Zulivio $VERSION" --notes "Packages for Ubuntu and Debian (amd64 and arm64). They install a systemd service that runs the version-pinned Docker images. One command: curl -fsSL https://zulivio.nodedr.com/install-linux.sh | sudo bash   Or: sudo apt install ./zulivio_${VERSION}_<arch>.deb  Guide: https://zulivio.nodedr.com/docs"
          fi
