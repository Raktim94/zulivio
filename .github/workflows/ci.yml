name: CI

# Runs on every PR (including Dependabot) so dependency bumps are build-checked
# before the security auto-merge workflow is allowed to merge them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm typecheck
      - run: pnpm build
